name: Build HandAR Vision IPA — V26

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode and project targets
        run: |
          xcodebuild -version
          xcodebuild -project HandARBrowser.xcodeproj -list

      - name: Validate project files
        run: |
          chmod +x Scripts/CHECK_PROJECT.command Scripts/BUILD_UNSIGNED_IPA.command
          ./Scripts/CHECK_PROJECT.command
          grep -Fq "HandAR Vision" HandARBrowser/Info.plist
          grep -Fq "<string>26</string>" HandARBrowser/Info.plist
          grep -Fq "import ARKit" HandARBrowser/MainViewController.swift
          grep -Fq "import SceneKit" HandARBrowser/MainViewController.swift
          grep -Fq "ARWorldTrackingConfiguration" HandARBrowser/MainViewController.swift
          grep -Fq "ARSessionDelegate" HandARBrowser/MainViewController.swift
          grep -Fq "private let browser: WKWebView = {" HandARBrowser/MainViewController.swift
          grep -Fq "private let leftEyeView = SCNView(frame: .zero)" HandARBrowser/MainViewController.swift
          grep -Fq "private let rightEyeView = SCNView(frame: .zero)" HandARBrowser/MainViewController.swift
          grep -Fq "private let arSceneView = ARSCNView(frame: .zero)" HandARBrowser/MainViewController.swift
          grep -Fq "configuration.worldAlignment = .gravity" HandARBrowser/MainViewController.swift
          grep -Fq "worldPointOnBrowser" HandARBrowser/MainViewController.swift
          grep -Fq "projectionMatrix(" HandARBrowser/MainViewController.swift
          grep -Fq "ARAnchor" HandARBrowser/MainViewController.swift
                    ! grep -Fq "final class EyeDisplayView" HandARBrowser/MainViewController.swift
          ! grep -Fq "private let eyeLeft = EyeDisplayView()" HandARBrowser/MainViewController.swift
          ! grep -Fq "private let eyeRight = EyeDisplayView()" HandARBrowser/MainViewController.swift
          grep -Fq "input.update(" HandARBrowser/MainViewController.swift
          ! grep -Fq "private let browserLeft" HandARBrowser/MainViewController.swift
          ! grep -Fq "private let browserRight" HandARBrowser/MainViewController.swift
          grep -Fq "final class ARStereoTrackingManager" HandARBrowser/MainViewController.swift
          grep -Fq "frame.camera.unprojectPoint" HandARBrowser/MainViewController.swift
          grep -Fq "frame.displayTransform(" HandARBrowser/MainViewController.swift
          grep -Fq "browserWorldDistance: Float = 1.55" HandARBrowser/MainViewController.swift
          grep -Fq "eyeSeparation: Float = 0.064" HandARBrowser/MainViewController.swift
          grep -Fq "didUpdate anchors: [ARAnchor]" HandARBrowser/MainViewController.swift
          ! grep -Fq 'LensMaskView' HandARBrowser/MainViewController.swift
          ! grep -Fq 'fillEllipse' HandARBrowser/MainViewController.swift
          ! grep -Fq 'normalized(SIMD3<Float>' HandARBrowser/MainViewController.swift
          ! grep -Fq 'panel.position =' HandARBrowser/MainViewController.swift
          ! grep -Fq 'panel.layer.position =' HandARBrowser/MainViewController.swift

      - name: Build iPhoneOS app (unsigned)
        run: ./Scripts/BUILD_UNSIGNED_IPA.command

      - name: Verify IPA structure
        run: |
          test -f build/HandARBrowser-unsigned.ipa
          /usr/bin/unzip -l build/HandARBrowser-unsigned.ipa | grep -E 'Payload/HandARBrowser.app/' >/dev/null
          /usr/bin/unzip -p build/HandARBrowser-unsigned.ipa Payload/HandARBrowser.app/Info.plist >/dev/null
          echo "IPA OK"
          /usr/bin/unzip -p build/HandARBrowser-unsigned.ipa Payload/HandARBrowser.app/Info.plist | grep -Fq "HandAR Vision"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandARBrowser-IPA
          path: build/HandARBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
