name: Build HandAR Vision IPA — V99

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode and project targets
        run: |
          xcodebuild -version
          xcodebuild -project HandARBrowser.xcodeproj -list

      - name: Validate project files
        run: |
          chmod +x Scripts/CHECK_PROJECT.command Scripts/BUILD_UNSIGNED_IPA.command
          ./Scripts/CHECK_PROJECT.command

      - name: Check performance policy and browser regressions
        run: |
          python3 Tests/check_hand_gestures.py
          python3 Tests/check_hand_tracker.py
          python3 Tests/check_menu_gestures.py
          python3 Tests/check_camera.py
          python3 Tests/check_fullscreen.py
          python3 Tests/check_spatial_windows.py
          python3 Tests/check_monoscopic.py
          python3 Tests/check_lens_calibration.py
          python3 Tests/check_live_navigation.py
          python3 Tests/check_pointer_bridge.py
          python3 Tests/check_performance.py
          python3 Tests/check_youtube_url.py
          python3 Tests/check_cinema_projection.py
          python3 Tests/check_cinema_alignment.py
          python3 Tests/check_cinema_room.py
          python3 Tests/check_cinema_comfort.py
          python3 Tests/check_head_aim.py
          python3 Tests/check_graffiti.py
          python3 Tests/check_graffiti_grab.py
          python3 Tests/check_graffiti_audio.py
          python3 Tests/check_graffiti_radio.py
          python3 Tests/check_graffiti_room.py
          python3 Tests/check_hand_foreground.py
          python3 Tests/check_virtual_hands.py
          python3 Tests/check_panorama.py
          python3 Tests/check_cinema_mask.py
          python3 Tests/check_cinema_audio.py
          python3 Tests/check_cinema_recovery.py
          python3 Tests/check_security_vr.py
          node --check HandARBrowser/WebInput.js
          node Tests/web-input.cjs
          node Tests/hand-input.cjs
          node Tests/web-performance.cjs
          node Tests/cinema-playback.cjs
          node Tests/cinema-audio.cjs
          node Tests/video-focus.cjs

      - name: Build iPhoneOS app (unsigned)
        run: ./Scripts/BUILD_UNSIGNED_IPA.command

      - name: Verify IPA structure
        run: |
          test -f build/HandARBrowser-unsigned.ipa
          /usr/bin/unzip -l build/HandARBrowser-unsigned.ipa | grep -E 'Payload/HandARBrowser.app/' >/dev/null
          /usr/bin/unzip -p build/HandARBrowser-unsigned.ipa Payload/HandARBrowser.app/Info.plist > build/packaged-Info.plist
          /usr/bin/plutil -lint build/packaged-Info.plist
          test "$(/usr/bin/plutil -extract CFBundleDisplayName raw -o - build/packaged-Info.plist)" = "HandAR Vision"
          test "$(/usr/bin/plutil -extract CFBundleVersion raw -o - build/packaged-Info.plist)" = "99"
          /usr/bin/plutil -extract UILaunchScreen json -o - build/packaged-Info.plist >/dev/null
          /usr/bin/unzip -p build/HandARBrowser-unsigned.ipa Payload/HandARBrowser.app/Panoramas/catalog.json > build/packaged-panoramas.json
          python3 -c 'import json; assert json.load(open("build/packaged-panoramas.json"))[0]["id"] == "burj-khalifa-night"'
          /usr/bin/unzip -p build/HandARBrowser-unsigned.ipa Payload/HandARBrowser.app/Panoramas/burj-khalifa-night.jpg > build/packaged-panorama.jpg
          cmp HandARBrowser/Panoramas/burj-khalifa-night.jpg build/packaged-panorama.jpg
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          with zipfile.ZipFile('build/HandARBrowser-unsigned.ipa') as ipa:
              for entry in json.loads(Path('HandARBrowser/GraffitiMusic/credits.json').read_text()):
                  relative = 'GraffitiMusic/' + entry['file']
                  assert ipa.read('Payload/HandARBrowser.app/' + relative) == Path('HandARBrowser', relative).read_bytes()
          PY
          echo "IPA OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandARBrowser-IPA
          path: build/HandARBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
