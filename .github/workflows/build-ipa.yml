name: Build HandAR Vision IPA — V77

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode and project targets
        run: |
          xcodebuild -version
          xcodebuild -project HandARBrowser.xcodeproj -list

      - name: Validate project files
        run: |
          chmod +x Scripts/CHECK_PROJECT.command Scripts/BUILD_UNSIGNED_IPA.command
          ./Scripts/CHECK_PROJECT.command

      - name: Check performance policy and browser regressions
        run: |
          python3 Tests/check_hand_gestures.py
          python3 Tests/check_hand_tracker.py
          python3 Tests/check_pointer_bridge.py
          python3 Tests/check_performance.py
          python3 Tests/check_youtube_url.py
          python3 Tests/check_cinema_projection.py
          node --check HandARBrowser/WebInput.js
          node Tests/web-input.cjs
          node Tests/hand-input.cjs
          node Tests/web-performance.cjs
          node Tests/cinema-playback.cjs

      - name: Build iPhoneOS app (unsigned)
        run: ./Scripts/BUILD_UNSIGNED_IPA.command

      - name: Verify IPA structure
        run: |
          test -f build/HandARBrowser-unsigned.ipa
          /usr/bin/unzip -l build/HandARBrowser-unsigned.ipa | grep -E 'Payload/HandARBrowser.app/' >/dev/null
          /usr/bin/unzip -p build/HandARBrowser-unsigned.ipa Payload/HandARBrowser.app/Info.plist > build/packaged-Info.plist
          /usr/bin/plutil -lint build/packaged-Info.plist
          test "$(/usr/bin/plutil -extract CFBundleDisplayName raw -o - build/packaged-Info.plist)" = "HandAR Vision"
          test "$(/usr/bin/plutil -extract CFBundleVersion raw -o - build/packaged-Info.plist)" = "77"
          echo "IPA OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandARBrowser-IPA
          path: build/HandARBrowser-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
